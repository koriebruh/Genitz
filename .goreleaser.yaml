version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: genitz
    main: .
    binary: genitz
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/koriebruh/Genitz/internal/generator.Version={{.Version}}

archives:
  - id: genitz-archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew publishing is disabled until a separate koriebruh/homebrew-tap
# repository exists and a HOMEBREW_TAP_GITHUB_TOKEN secret (push access to
# that repo) is added here — without both, this step fails and takes the
# whole `goreleaser release` run down as red, even though the binaries/
# checksums/GitHub Release publish as independent steps before it runs.
# Re-enable by restoring the block below once the tap repo + secret exist:
#
# brews:
#   - name: genitz
#     repository:
#       owner: koriebruh
#       name: homebrew-tap
#     directory: Formula
#     homepage: "https://github.com/koriebruh/Genitz"
#     description: "Go project starter & dependency picker CLI"
#     license: "Apache-2.0"
#     test: |
#       system "#{bin}/genitz", "version"
